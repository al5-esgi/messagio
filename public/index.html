<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat multi-salons</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 1.5rem;
        max-width: 720px;
      }
      #salons button {
        font: inherit;
        margin: 2px;
      }
      #salons button.sel {
        font-weight: bold;
        outline: 2px solid #333;
      }
      #fil {
        border: 1px solid #ccc;
        height: 45vh;
        overflow: auto;
        padding: 0.5rem;
        margin: 0.5rem 0;
      }
      .msg {
        margin: 2px 0;
      }
      .auteur {
        font-weight: bold;
      }
      .hint {
        color: #666;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 4px;
      }
      .msg.systeme { color: #888; font-style: italic; }
      .msg.refuse { color: #c00; font-weight: 600; }
      .aide code { background: #eee; padding: 1px 4px; border-radius: 3px; }
      #presence {
        margin: 6px 0;
        font-size: 13px;
        color: #444;
        min-height: 18px;
      }
      #presence .qui {
        display: inline-block;
        background: #eef;
        border-radius: 10px;
        padding: 1px 8px;
        margin-right: 4px;
      }
      #presence .qui.ecrit { background: #ffeaa7; }
      #saisie {
        min-height: 18px;
        font-size: 12px;
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Chat <span id="status" class="hint">deconnecte</span></h1>
    <div id="salons"></div>
    <p class="aide">
      Ouvrez 2 onglets sur des salons differents : les messages ne se melangent plus
      (une room <code>salon:&lt;id&gt;</code> par salon). Identifiez-vous avec
      <code>?membre=alice</code> dans l'URL. Le salon <strong>Dev</strong> est prive :
      reserve a alice et bob.
    </p>
    <div id="presence"></div>
    <div id="fil"></div>
    <div id="saisie"></div>
    <form id="f">
      <input id="t" placeholder="message..." autocomplete="off" /><button>
        Envoyer
      </button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      // Etape 4 : Socket.IO. Une room par salon, un ack sur chaque action.
      // Etape 6 : deduplication par `seq` et resynchronisation apres coupure.
      import { SalonClient } from "./salon-client.js";
      const params = new URLSearchParams(location.search);
      const me = params.get("membre") || "u" + Math.floor(Math.random() * 1000);
      let sel = params.get("salon") || "general";
      const status = document.getElementById("status");
      const fil = document.getElementById("fil");
      let socket = null;

      const info = (t) => (status.textContent = t);

      fetch("/api/dev-token?pseudo=" + encodeURIComponent(me))
        .then((r) => r.json())
        .then(({ token }) => demarrer(token))
        .catch(() => info("jeton indisponible"));

      function demarrer(token) {
        // Le jeton passe par `auth`, pas par l'URL : il ne finit pas dans les journaux.
        socket = io({ auth: { token } });
        // Un module n'expose pas ses variables a la console : on le fait explicitement,
        // pour que les manipulations de TP restent possibles depuis DevTools.
        window.socket = socket;
        window.clients = clients;

        socket.on("connect", () => {
          info("connecte " + me);
          rejoindre(sel);
        });

        socket.on("connect_error", (e) =>
          info("connexion refusee : " + e.message),
        );
        socket.on("disconnect", (r) => info("deconnecte (" + r + ")"));

        // Reconnexion automatique : Socket.IO la gere, il faut seulement
        // REJOINDRE a nouveau la room - une room ne survit pas a la session.
        socket.io.on("reconnect", (n) => {
          // La room ne survit pas a la session : il faut re-join. On en profite pour
          // demander la suite depuis notre dernier seq connu (etape 6).
          info(
            "reconnecte (tentative " + n + ") - resync de " + sel +
              " depuis seq " + clientDu(sel).lastSeq,
          );
          rejoindre(sel);
        });
        socket.io.on("reconnect_attempt", (n) => info("reconnexion... " + n));

        socket.on("message", (msg) => {
          // Meme en direct on passe par la deduplication : un message peut arriver
          // ici ET dans le lot de resynchronisation qui suit une coupure.
          const nouveau = clientDu(msg.salonId).recevoir(msg);
          if (msg.salonId !== sel || !nouveau) return;
          messages = clientDu(sel).affiches;
          render();
        });

        socket.on("presence-joined", ({ membre }) => {
          if (!presents.some((p) => p.membre === membre))
            presents.push({ membre, saisit: false });
          ligneSysteme(membre + " a rejoint");
          renderPresence();
        });

        // N'arrive qu'apres le delai de grace : un rechargement de page n'en produit pas.
        socket.on("presence-left", ({ membre }) => {
          presents = presents.filter((p) => p.membre !== membre);
          ecrivent.delete(membre);
          ligneSysteme(membre + " est parti");
          renderPresence();
        });

        socket.on("typing", ({ membre }) => marquerEcrit(membre));
      }

      // Un SalonClient par salon : il garde les seq deja vus, donc un renvoi
      // (reconnexion, chevauchement, message recu deux fois) n'ajoute pas de doublon.
      const clients = new Map();
      const clientDu = (salonId) => {
        if (!clients.has(salonId)) clients.set(salonId, new SalonClient());
        return clients.get(salonId);
      };
      let messages = [];
      let presents = [];              // [{ membre, saisit }]
      const ecrivent = new Map();     // membre -> minuteur d'expiration du "X ecrit"

      function renderPresence() {
        document.getElementById("presence").innerHTML = presents.length
          ? presents
              .map(
                (p) =>
                  `<span class="qui${ecrivent.has(p.membre) ? " ecrit" : ""}">${p.membre}</span>`,
              )
              .join("")
          : '<span style="color:#999">personne d\'autre ici</span>';

        const noms = [...ecrivent.keys()].filter((m) => m !== me);
        document.getElementById("saisie").textContent = noms.length
          ? noms.join(", ") + (noms.length > 1 ? " ecrivent..." : " ecrit...")
          : "";
      }

      // Le signal est ephemere : s'il cesse d'etre reemis, il expire tout seul.
      function marquerEcrit(membre) {
        clearTimeout(ecrivent.get(membre));
        ecrivent.set(
          membre,
          setTimeout(() => {
            ecrivent.delete(membre);
            renderPresence();
          }, 4000),
        );
        renderPresence();
      }

      /** Un ack qui n'arrive jamais est indiscernable d'un message perdu : d'ou le timeout. */
      const DELAI_ACK_MS = 5000;

      async function rejoindre(salonId) {
        let res;
        const client = clientDu(salonId);
        try {
          // On annonce le dernier seq deja affiche : le serveur renvoie la suite.
          res = await socket
            .timeout(DELAI_ACK_MS)
            .emitWithAck("join", "salon:" + salonId, {
              depuisSeq: client.lastSeq,
            });
        } catch {
          info(
            "join " + salonId + " : pas de reponse du serveur en " + DELAI_ACK_MS + " ms",
          );
          return;
        }

        if (!res.ok) {
          info("join " + salonId + " REFUSE : " + res.raison);
          fil.innerHTML =
            '<div class="msg refuse">acces refuse : ' + res.raison + "</div>";
          presents = [];
          ecrivent.clear();
          renderPresence();
          return;
        }

        sel = salonId;
        const nouveaux = client.recevoirLot(res.messages);
        messages = client.affiches;
        if (res.messages.length !== nouveaux) {
          console.log(
            `resync : ${res.messages.length} recus, ${nouveaux} nouveaux, ` +
              `${res.messages.length - nouveaux} doublon(s) ignore(s)`,
          );
        }
        // Snapshot : on connait l'etat courant sans attendre que quelqu'un bouge.
        presents = res.presents || [];
        ecrivent.clear();
        for (const p of presents) if (p.saisit) marquerEcrit(p.membre);
        info("connecte " + me + " - salon " + sel);
        mark();
        render();
        renderPresence();
      }

      function ligneSysteme(texte) {
        messages.push({ systeme: true, texte });
        render();
      }

      fetch("/api/salons")
        .then((r) => r.json())
        .then((list) => {
          document.getElementById("salons").innerHTML = list
            .map(
              (s) =>
                `<button data-s="${s.id}">${s.nom}${s.prive ? " (prive)" : ""}</button>`,
            )
            .join("");
          document.querySelectorAll("#salons button").forEach((b) => {
            b.onclick = () => rejoindre(b.dataset.s);
          });
          mark();
        });

      function mark() {
        document
          .querySelectorAll("#salons button")
          .forEach((b) => b.classList.toggle("sel", b.dataset.s === sel));
      }

      function render() {
        fil.innerHTML = messages
          .map((m) =>
            m.systeme
              ? `<div class="msg systeme">${m.texte}</div>`
              : `<div class="msg"><span class="auteur">${m.auteur}</span> ${m.texte}</div>`,
          )
          .join("");
        fil.scrollTop = fil.scrollHeight;
      }

      // Emission throttlee : au plus un `typing` par seconde, meme en tapant vite.
      // Sans cela on saturerait le rate-limit de 15 messages/s a la premiere phrase.
      let dernierTyping = 0;
      document.getElementById("t").addEventListener("input", () => {
        const t = Date.now();
        if (!socket || t - dernierTyping < 1000) return;
        dernierTyping = t;
        socket.emit("typing");
      });

      document.getElementById("f").addEventListener("submit", (e) => {
        e.preventDefault();
        const t = document.getElementById("t");
        if (!t.value || !socket) return;
        const texte = t.value;
        t.value = "";
        // Ack sur l'evenement metier : le serveur renvoie le seq qu'il a attribue.
        socket
          .timeout(DELAI_ACK_MS)
          .emitWithAck("message", { salonId: sel, texte })
          .then((res) => {
            if (!res.ok) info("message refuse : " + res.raison);
            else console.log("message confirme, seq =", res.seq);
          })
          .catch(() => {
            // Ni confirme ni refuse : le message est peut-etre passe. On le signale
            // plutot que de le renvoyer, un renvoi aveugle produirait un doublon
            // (c'est precisement ce que la deduplication de l'etape 6 traitera).
            info("message non confirme apres " + DELAI_ACK_MS + " ms - etat incertain");
          });
      });
    </script>
  </body>
</html>
